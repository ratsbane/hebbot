[project]
name = "hebbot"
version = "0.1.0"
description = "A substrate for agentic foundation models to bootstrap continuously-learning embodied systems."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "mcp>=1.0",
]

[project.optional-dependencies]
robot = [
    "panda-python>=0.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
hebbot-mcp = "hebbot.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hebbot"]
